name: .NET Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore

      - name: Run Tests
        run: dotnet test --no-build --logger "trx;LogFileName=TestResults.trx"

      - name: Upload Test Results (Word report)
        uses: actions/upload-artifact@v3
        with:
          name: Word-Test-Report
          path: pD:\AutomationTests\SmartAccounting\Reports\WordReport.docx
